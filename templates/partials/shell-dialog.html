{%- if presentation.chrome is defined and presentation.chrome.shell is defined %}
{%- set copy = presentation.chrome.shell %}
<template id="publication-dialog">
  <dialog class="shell__dialog" aria-labelledby="shell-title">
    <div class="shell__heading">
      <h2 id="shell-title" class="shell__title" tabindex="-1"></h2>
      <button type="button" class="control control--secondary shell__close">{{ copy.close_label }}</button>
    </div>
    {% if notes and presentation.chrome.regions is defined %}
    {% set notes_label = presentation.chrome.regions | get(key="base:notes", default="") %}
    {% if notes_label %}<section class="shell__tenant" data-tenant="notes" data-tenant-title="{{ notes_label }}" hidden></section>{% endif %}
    {% endif %}
    {%- if presentation.search is defined and copy.search is defined and not presentation.search.page %}
    <section class="shell__tenant" data-tenant="search" data-tenant-title="{{ copy.search.title }}" data-source-site="{{ serving_site }}"
      {{ search::labels(copy=presentation.chrome.regions) }} hidden>
      <label class="shell__label" for="shell-query">{{ copy.search.field_label }}</label>
      <input id="shell-query" type="search" role="combobox" aria-expanded="false" aria-controls="shell-results" aria-autocomplete="list" autocomplete="off" maxlength="1024">
      <ul id="shell-results" class="shell__results" role="listbox" aria-labelledby="shell-title"></ul>
      <p class="shell__status" role="status" data-status-loading="{{ copy.search.loading_message }}" data-status-empty="{{ copy.search.empty_message }}" data-status-unavailable="{{ copy.search.unavailable_message }}"{% if presentation.chrome.regions is defined %}{% if presentation.chrome.regions["base:search-idle"] is defined %} data-status-idle="{{ presentation.chrome.regions["base:search-idle"] }}"{% endif %}{% if presentation.chrome.regions["base:search-results"] is defined %} data-status-results="{{ presentation.chrome.regions["base:search-results"] }}"{% endif %}{% endif %}></p>
      {% if presentation.chrome.regions is defined and presentation.chrome.regions["base:search-retry"] is defined %}<button type="button" class="control control--primary" data-search-retry hidden>{{ presentation.chrome.regions["base:search-retry"] }}</button>{% endif %}
    </section>
    {%- endif %}
    {% set media_title = presentation.chrome.regions | get(key="base:media-title", default="") %}
    {% set media_expand = presentation.chrome.regions | get(key="base:media-expand", default="") %}
    {% set media_images = images | default(value=[]) %}
    {% if notes and notes.images is defined %}{% set media_images = media_images | concat(with=notes.images) %}{% endif %}
    {% if media_images and media_title and media_expand %}
    <section class="shell__tenant" data-tenant="media" data-tenant-title="{{ media_title }}" data-media-expand="{{ media_expand }}" hidden>
      <script type="application/json" data-media-images>{{ media_images | json_script }}</script>
      <div class="media-viewer__tools">
        <button type="button" class="control control--secondary" data-media-size hidden>{{ presentation.chrome.regions["base:media-detail"] }}</button>
        <button type="button" class="control control--secondary" data-media-fit hidden>{{ presentation.chrome.regions["base:media-fit"] }}</button>
      </div>
      <figure class="media-viewer"><div class="media-viewer__viewport"></div><figcaption hidden></figcaption></figure>
    </section>
    {% endif %}
    {%- if copy.settings is defined %}
    <section class="shell__tenant" data-tenant="settings" data-tenant-title="{{ copy.settings.title }}" hidden>
      <fieldset class="shell__setting" data-setting="color-mode">
        <legend>{{ copy.settings.color_mode_label }}</legend>
        <div class="shell__setting-options">
          <label><input type="radio" name="color-mode" value="system">{{ copy.settings.color_mode_system_label }}</label>
          <label><input type="radio" name="color-mode" value="light">{{ copy.settings.color_mode_light_label }}</label>
          <label><input type="radio" name="color-mode" value="dark">{{ copy.settings.color_mode_dark_label }}</label>
        </div>
      </fieldset>
      <fieldset class="shell__setting" data-setting="motion-preference">
        <legend>{{ copy.settings.motion_label }}</legend>
        <div class="shell__setting-options">
          <label><input type="radio" name="motion-preference" value="system">{{ copy.settings.motion_system_label }}</label>
          <label><input type="radio" name="motion-preference" value="reduce">{{ copy.settings.motion_reduce_label }}</label>
          <label><input type="radio" name="motion-preference" value="allow">{{ copy.settings.motion_allow_label }}</label>
        </div>
      </fieldset>
      {% include "base/partials/analytics-consent.html" %}
      {# data-setting="local-drafts" (clear locally stored drafts) joins here only where a tenant #}
      {# that keeps drafts is enabled. #}
      <p class="shell__status" role="status" data-settings-status{% if presentation.chrome.regions["base:settings-storage-unavailable"] is defined %} data-storage-unavailable="{{ presentation.chrome.regions["base:settings-storage-unavailable"] }}"{% endif %}></p>
    </section>
    {%- endif %}
  </dialog>
</template>
{%- endif %}
