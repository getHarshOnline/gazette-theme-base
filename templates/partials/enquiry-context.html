{% if content.id is defined and route.canonical_url is defined and presentation.chrome is defined %}
{% if enquiry_destination %}
<script type="application/json" id="enquiry-context">{"source":{"site":{{ content.site | json_script }},"content":{{ content.id | json_script }},"url":{{ route.canonical_url | json_script }}},"destination":{"site":{{ enquiry_destination.content.site | json_script }},"content":{{ enquiry_destination.content.id | json_script }},"url":{{ enquiry_destination.route.url | json_script }}},"copy":{"subject":{{ presentation.chrome.regions | get(key="base:enquiry-context-subject", default="") | json_script }},"heading":{{ presentation.chrome.regions | get(key="base:enquiry-context-title", default="") | json_script }},"page":{{ presentation.chrome.regions | get(key="base:enquiry-context-page", default="") | json_script }},"button":{{ presentation.chrome.regions | get(key="base:enquiry-context-button", default="") | json_script }},"actions":{"services-footer":{{ presentation.chrome.regions | get(key="base:enquiry-action-services-footer", default="") | json_script }},"services-invitation":{{ presentation.chrome.regions | get(key="base:enquiry-action-services-invitation", default="") | json_script }},"services-link":{{ presentation.chrome.regions | get(key="base:enquiry-action-services-link", default="") | json_script }},"enquiry-email":{{ presentation.chrome.regions | get(key="base:enquiry-action-enquiry-email", default="") | json_script }} } } }</script>
{% endif %}
{% endif %}
